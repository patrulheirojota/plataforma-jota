<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Cronograma — Patrulheiros de Elite</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:#0a1420;color:#e8edf4;min-height:100vh}
  .wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}

  .topbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .marca{font-size:19px;font-weight:700;letter-spacing:-.3px}
  .marca span{color:#C9A83C}
  .btn{padding:9px 15px;border-radius:9px;border:1px solid #24384f;background:#132030;color:#9fb2c7;font-size:13px;cursor:pointer;font-weight:500;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:#3a5675;color:#e8edf4}
  .btn-ouro{background:#C9A83C;border-color:#C9A83C;color:#0a1420;font-weight:700}
  .btn-ouro:hover{background:#dbb949;color:#0a1420}

  .strip{display:grid;grid-template-columns:2fr repeat(4,1fr);gap:1px;background:#1b2c40;border:1px solid #1b2c40;border-radius:14px;overflow:hidden;margin-bottom:16px}
  .strip-c{background:#101d2c;padding:15px 16px}
  .strip-l{color:#63809e;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:600}
  .strip-v{font-size:16px;font-weight:700;margin-top:5px;color:#e8edf4}
  .strip-v.g{color:#C9A83C}

  .hero{background:linear-gradient(100deg,#16283c 0%,#0e1c2c 60%);border:1px solid #C9A83C;border-radius:16px;padding:22px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:26px;position:relative;overflow:hidden}
  .hero::after{content:'';position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,60,.14),transparent 70%)}
  .trofeu{width:60px;height:60px;border-radius:50%;background:#C9A83C;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
  .hero-l{color:#C9A83C;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;font-weight:700}
  .hero-t{font-size:22px;font-weight:700;margin-top:3px;letter-spacing:-.4px}
  .hero-d{color:#8fa5bd;font-size:13px;margin-top:3px}
  .hero-n{font-size:52px;font-weight:800;color:#C9A83C;line-height:.95;text-align:right}
  .hero-nl{color:#8fa5bd;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;text-align:right;margin-top:4px}

  .sec{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .sec h2{font-size:26px;font-weight:800;letter-spacing:-.6px}
  .sec p{color:#63809e;font-size:13px;margin-top:2px}

  .layout{display:grid;grid-template-columns:1fr 268px;gap:16px;align-items:start}
  .painel{background:#101d2c;border:1px solid #1b2c40;border-radius:16px;padding:16px}

  .nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .nav-b{width:32px;height:32px;border-radius:8px;border:1px solid #24384f;background:#132030;color:#9fb2c7;cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center}
  .nav-b:hover{border-color:#C9A83C;color:#C9A83C}
  .nav-t{flex:1;text-align:center;font-size:14px;font-weight:600;color:#C9A83C}

  .board{display:grid;grid-template-columns:repeat(7,minmax(122px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
  .col{min-width:122px}
  .col-h{text-align:center;padding:9px 4px;border-radius:9px;font-size:12px;font-weight:600;color:#8fa5bd;background:#0c1826;margin-bottom:8px;border:1px solid transparent}
  .col-h.hoje{background:#C9A83C;color:#0a1420;font-weight:700;border-color:#C9A83C}
  .col-h .dn{font-size:15px;font-weight:700;color:#e8edf4;display:block;margin-top:1px}
  .col-h.hoje .dn{color:#0a1420}

  .scard{background:#0d1a28;border:1px solid var(--c);border-left:3px solid var(--c);border-radius:9px;padding:9px 10px;margin-bottom:7px;cursor:pointer;transition:.15s}
  .scard:hover{background:#122236;transform:translateY(-1px)}
  .scard.ok{opacity:.42}
  .scard.ok .sc-t{text-decoration:line-through}
  .sc-top{display:flex;align-items:flex-start;gap:7px}
  .circ{width:15px;height:15px;border-radius:50%;border:2px solid var(--c);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#0a1420;font-weight:900;transition:.15s}
  .circ.on{background:var(--c)}
  .sc-d{color:var(--c);font-size:11px;font-weight:700;line-height:1.25}
  .sc-t{color:#c3d2e2;font-size:11.5px;line-height:1.35;margin-top:4px;margin-left:22px}
  .sc-f{display:flex;align-items:center;gap:5px;margin-top:7px;margin-left:22px;flex-wrap:wrap}
  .pill{font-size:9px;padding:2px 7px;border-radius:20px;background:#182838;color:#8fa5bd;font-weight:600}
  .pill-t{border:1px solid var(--c);color:var(--c);background:transparent;text-transform:uppercase;letter-spacing:.4px}

  .cad{background:linear-gradient(135deg,#241a38,#14192c);border:1px solid #7d5fa8;border-radius:9px;padding:8px 9px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:7px}
  .cad.ok{opacity:.45}
  .cad-c{width:15px;height:15px;border-radius:4px;border:2px solid #b98ae0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;color:#0a1420;font-weight:900}
  .cad-c.on{background:#b98ae0}
  .cad-t{color:#c9a9e8;font-size:10px;font-weight:700;line-height:1.3}

  .vazio{text-align:center;padding:16px 4px;color:#3d5470;font-size:11px}

  .cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .cal-m{font-size:13px;font-weight:700;color:#C9A83C;text-transform:uppercase;letter-spacing:.6px}
  .cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal-wd{text-align:center;font-size:10px;color:#4d6684;padding:3px 0;font-weight:600}
  .cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:12px;border-radius:7px;color:#7f96ae;cursor:pointer;position:relative;transition:.12s}
  .cal-d:hover{background:#182838}
  .cal-d.fora{color:#2b3d52;cursor:default}
  .cal-d.tem{color:#e8edf4;font-weight:600}
  .cal-d.hoje{background:#C9A83C;color:#0a1420;font-weight:800}
  .cal-d.sel{border:1.5px solid #C9A83C;color:#C9A83C;font-weight:700}
  .cal-d.tudo::after{content:'';position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:#6ddba0}

  .legenda{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #1b2c40}
  .leg{display:flex;align-items:center;gap:5px;font-size:11px;color:#63809e}
  .leg-d{width:8px;height:8px;border-radius:2px}

  .aviso{background:#2a1418;border:1px solid #d9566a;border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:13px;flex-wrap:wrap}

  .modal{position:fixed;inset:0;background:rgba(5,10,18,.82);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.on{display:flex}
  .modal-c{background:#101d2c;border:1px solid #24384f;border-radius:16px;padding:22px;max-width:430px;width:100%}
  .inp{width:100%;padding:10px;border-radius:9px;border:1px solid #24384f;background:#0a1420;color:#e8edf4;font-size:14px;margin-top:5px}

  .estado{text-align:center;padding:60px 20px}

  @media(max-width:960px){
    .layout{grid-template-columns:1fr}
    .strip{grid-template-columns:1fr 1fr}
    .hero-n{font-size:42px}
  }
  @media(max-width:600px){
    .wrap{padding:14px 10px 50px}
    .strip{grid-template-columns:1fr 1fr;border-radius:12px}
    .strip-v{font-size:14px}
    .sec h2{font-size:21px}
    .hero{padding:18px}
    .trofeu{width:48px;height:48px;font-size:22px}
    .hero-t{font-size:18px}
    .hero-n{font-size:38px}
    .board{grid-template-columns:repeat(7,150px)}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div>
      <div class="marca">Patrulheiros <span>de Elite</span></div>
      <div id="sub" style="color:#63809e;font-size:12px;margin-top:2px"></div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="location.href='edital.html'">Edital</button>
      <button class="btn" onclick="location.href='dashboard.html'">Painel</button>
      <button class="btn" onclick="sair()">Sair</button>
    </div>
  </div>

  <div id="loading" class="estado" style="color:#63809e">Carregando seu cronograma...</div>

  <div id="vazio" class="estado" style="display:none">
    <div style="font-size:46px;margin-bottom:12px">🗓️</div>
    <div style="color:#C9A83C;font-weight:700;font-size:17px">Cronograma ainda nao gerado</div>
    <p style="color:#63809e;font-size:13px;margin-top:6px">Seu mentor ainda nao montou seu plano por tema.</p>
    <button class="btn btn-ouro" style="margin-top:16px" onclick="location.href='dashboard.html'">Ir para o painel</button>
  </div>

  <div id="app" style="display:none">

    <div class="strip" id="strip"></div>
    <div class="hero" id="hero"></div>
    <div id="aviso-atraso"></div>

    <div class="sec">
      <div>
        <h2>Planejamento</h2>
        <p id="sec-sub"></p>
      </div>
      <button class="btn btn-ouro" onclick="irHoje()">Hoje</button>
    </div>

    <div class="layout">
      <div class="painel">
        <div class="nav">
          <button class="nav-b" onclick="mudarSemana(-1)">&#8249;</button>
          <div class="nav-t" id="label-sem"></div>
          <button class="nav-b" onclick="mudarSemana(1)">&#8250;</button>
        </div>
        <div class="board" id="board"></div>
        <div class="legenda" id="legenda"></div>
      </div>

      <div class="painel">
        <div class="cal-h">
          <button class="nav-b" onclick="mudarMes(-1)">&#8249;</button>
          <div class="cal-m" id="cal-mes"></div>
          <button class="nav-b" onclick="mudarMes(1)">&#8250;</button>
        </div>
        <div class="cal-g" id="cal-wd"></div>
        <div class="cal-g" id="cal-grid" style="margin-top:3px"></div>
        <div id="cal-resumo" style="margin-top:14px;padding-top:12px;border-top:1px solid #1b2c40"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)fecharModal()">
  <div class="modal-c" id="modal-c"></div>
</div>

<script src="config.js"></script>
<script>
const WD = ['Seg','Ter','Qua','Qui','Sex','Sab','Dom']
const CURTO = ['Dom','Seg','Ter','Qua','Qui','Sex','Sab']
const MES = ['Janeiro','Fevereiro','Marco','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro']
const PALETA = ['#e8b04b','#5bb3f0','#6ddba0','#f07171','#4ecdc4','#b98ae0','#f0955b','#8ab4f0','#d4e05b','#f08ab4','#7fd1ae','#e0916b']
const LABEL = { teoria:'Teoria', questoes:'Questoes', revisao:'Revisao' }

let _alunoId=null,_concursoId=null,_concursoNome='',_dataProva=null,_cfg=null
let _sessoes=[],_porData={},_refSem=null,_refMes=null,_corDisc={}

function ymd(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function parseD(s){return new Date(s+'T12:00:00')}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function hojeStr(){return ymd(new Date())}
function inicioSemana(d){const b=new Date(d);return addDays(b,-((b.getDay()+6)%7))}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function dur(m){const h=Math.floor(m/60),r=m%60;return h>0?(h+'h'+(r?r+'min':'')):(r+'min')}

function corDe(disc){
  if (_corDisc[disc]) return _corDisc[disc]
  let h=0
  for(let i=0;i<disc.length;i++) h=(h*31+disc.charCodeAt(i))>>>0
  const usadas=Object.values(_corDisc)
  let cor=PALETA[h%PALETA.length],t=0
  while(usadas.indexOf(cor)>=0 && t<PALETA.length){ cor=PALETA[(h+(++t))%PALETA.length] }
  _corDisc[disc]=cor
  return cor
}

async function init(){
  const { data:{ user } } = await _supabase.auth.getUser()
  if(!user){location.href='index.html';return}
  _alunoId=user.id

  const { data: aluno } = await _supabase.from('alunos').select('nome, data_expiracao').eq('id',user.id).single()
  if(!aluno){alert('Aluno nao encontrado. Contate o mentor.');return}
  if(aluno.data_expiracao){
    const h=new Date();h.setHours(0,0,0,0)
    if(h>new Date(aluno.data_expiracao+'T00:00:00')){location.href='dashboard.html';return}
  }

  const { data: sess } = await _supabase.from('sessoes_estudo').select('*')
    .eq('aluno_id',_alunoId).order('data').order('ordem')

  document.getElementById('loading').style.display='none'
  if(!sess||!sess.length){document.getElementById('vazio').style.display='block';return}

  _sessoes=sess
  _concursoId=sess[0].concurso_id

  const { data: conc } = await _supabase.from('concursos').select('nome, data_prova').eq('id',_concursoId).single()
  _concursoNome=conc?conc.nome:''
  const { data: cfg } = await _supabase.from('config_cronograma').select('*')
    .eq('aluno_id',_alunoId).eq('concurso_id',_concursoId).maybeSingle()
  _cfg=cfg
  _dataProva=(cfg&&cfg.data_prova)?cfg.data_prova:(conc?conc.data_prova:null)

  document.getElementById('sub').textContent=aluno.nome+' · '+_concursoNome
  document.getElementById('app').style.display='block'

  indexar()
  const hj=hojeStr()
  const alvo=_porData[hj]?hj:proxima(hj)
  _refSem=parseD(alvo); _refMes=parseD(alvo)
  desenhar()
}

function indexar(){
  _porData={}
  _sessoes.forEach(function(s){ if(!_porData[s.data])_porData[s.data]=[]; _porData[s.data].push(s) })
  const discs=[]
  _sessoes.forEach(function(s){ if(discs.indexOf(s.disciplina)<0) discs.push(s.disciplina) })
  discs.sort().forEach(function(d){ corDe(d) })
}

function proxima(a){
  const ds=Object.keys(_porData).sort()
  for(let i=0;i<ds.length;i++) if(ds[i]>=a) return ds[i]
  return ds.length?ds[ds.length-1]:a
}

function desenhar(){ renderStrip(); renderHero(); renderAviso(); renderBoard(); renderCal(); renderLegenda() }

function renderStrip(){
  const total=_sessoes.length
  const feitas=_sessoes.filter(function(s){return s.concluida}).length
  const datas=Object.keys(_porData).sort()
  const hj=hojeStr()
  let diaAtual=datas.filter(function(d){return d<=hj}).length
  if(diaAtual<1)diaAtual=1
  const teoT=_sessoes.filter(function(s){return s.tipo==='teoria'}).length
  const teoF=_sessoes.filter(function(s){return s.tipo==='teoria'&&s.concluida}).length
  const pctEd=teoT?Math.round(teoF/teoT*100):Math.round(feitas/total*100)
  const porDia=_cfg?_cfg.sessoes_por_dia:Math.round(total/Math.max(datas.length,1))
  const fim=datas.length?parseD(datas[datas.length-1]).toLocaleDateString('pt-BR'):'--'

  document.getElementById('strip').innerHTML=
    '<div class="strip-c"><div class="strip-l">Turma</div><div class="strip-v">'+esc(_concursoNome||'Meu plano')+'</div></div>'
   +'<div class="strip-c"><div class="strip-l">Dia</div><div class="strip-v">'+diaAtual+' de '+datas.length+'</div></div>'
   +'<div class="strip-c"><div class="strip-l">Plano</div><div class="strip-v">'+porDia+' sessoes/dia</div></div>'
   +'<div class="strip-c"><div class="strip-l">Conclusao prevista</div><div class="strip-v">'+fim+'</div></div>'
   +'<div class="strip-c"><div class="strip-l">Progresso do edital</div><div class="strip-v g">'+pctEd+'%</div></div>'
}

function renderHero(){
  let dias=null
  if(_dataProva){const h=new Date();h.setHours(0,0,0,0);dias=Math.ceil((parseD(_dataProva)-h)/86400000)}
  document.getElementById('hero').innerHTML=
    '<div class="trofeu">🏆</div>'
   +'<div style="flex:1;min-width:180px;position:relative;z-index:1">'
   +'<div class="hero-l">Dia da prova</div>'
   +'<div class="hero-t">'+esc(_concursoNome||'Seu concurso')+'</div>'
   +'<div class="hero-d">'+(_dataProva?parseD(_dataProva).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}):'Data nao definida')+'</div>'
   +'</div>'
   +(dias!==null?'<div style="position:relative;z-index:1"><div class="hero-n">'+(dias>0?dias:0)+'</div><div class="hero-nl">dias restantes</div></div>':'')
}

function renderAviso(){
  const hj=hojeStr()
  const at=_sessoes.filter(function(s){return !s.concluida&&s.data<hj})
  const box=document.getElementById('aviso-atraso')
  if(!at.length){box.innerHTML='';return}
  box.innerHTML='<div class="aviso"><span style="font-size:22px">⏰</span>'
   +'<div style="flex:1;min-width:180px"><div style="color:#f07171;font-weight:700;font-size:14px">'+at.length+' sessoes atrasadas</div>'
   +'<div style="color:#a8b8c8;font-size:12px;margin-top:2px">A mais antiga e de '+parseD(at[0].data).toLocaleDateString('pt-BR')+'. Coloque em dia ou peca replanejamento ao mentor.</div></div>'
   +'<button class="btn" style="border-color:#d9566a;color:#f07171" onclick="irData(\''+at[0].data+'\')">Ver</button></div>'
}

function renderBoard(){
  const ini=inicioSemana(_refSem)
  const hj=hojeStr()
  let html=''
  for(let i=0;i<7;i++){
    const d=addDays(ini,i), key=ymd(d)
    const sess=_porData[key]||[]
    html+='<div class="col"><div class="col-h'+(key===hj?' hoje':'')+'">'+CURTO[d.getDay()]+'<span class="dn">'+d.getDate()+'</span></div>'
    if(!sess.length){ html+='<div class="vazio">—</div></div>'; continue }
    const cadOk=sess.some(function(s){return s.caderno_erros_lido})
    html+='<div class="cad'+(cadOk?' ok':'')+'" onclick="marcarCaderno(\''+key+'\','+(!cadOk)+')">'
      +'<div class="cad-c'+(cadOk?' on':'')+'">'+(cadOk?'✓':'')+'</div>'
      +'<div class="cad-t">Caderno de erros</div></div>'
    sess.forEach(function(s){
      const c=corDe(s.disciplina)
      html+='<div class="scard'+(s.concluida?' ok':'')+'" style="--c:'+c+'" onclick="abrirSessao(\''+s.id+'\')">'
        +'<div class="sc-top">'
        +'<div class="circ'+(s.concluida?' on':'')+'" onclick="event.stopPropagation();toggleSessao(\''+s.id+'\')">'+(s.concluida?'✓':'')+'</div>'
        +'<div class="sc-d">'+esc(s.disciplina)+'</div></div>'
        +'<div class="sc-t">'+esc(s.topico)+'</div>'
        +'<div class="sc-f"><span class="pill pill-t">'+LABEL[s.tipo]+'</span><span class="pill">'+dur(s.tempo_minutos)+'</span>'
        +(s.questoes_feitas?'<span class="pill">'+s.questoes_feitas+'q</span>':'')
        +'</div></div>'
    })
    html+='</div>'
  }
  document.getElementById('board').innerHTML=html
  const fim=addDays(ini,6)
  document.getElementById('label-sem').textContent=
    ini.toLocaleDateString('pt-BR',{day:'2-digit',month:'short'})+' — '+fim.toLocaleDateString('pt-BR',{day:'2-digit',month:'short',year:'numeric'})
  document.getElementById('sec-sub').textContent=MES[ini.getMonth()]+' de '+ini.getFullYear()
}

function renderLegenda(){
  const discs=Object.keys(_corDisc).sort()
  document.getElementById('legenda').innerHTML=discs.map(function(d){
    return '<span class="leg"><span class="leg-d" style="background:'+_corDisc[d]+'"></span>'+esc(d)+'</span>'
  }).join('')
}

function renderCal(){
  document.getElementById('cal-wd').innerHTML=WD.map(function(w){return '<div class="cal-wd">'+w[0]+'</div>'}).join('')
  const y=_refMes.getFullYear(), m=_refMes.getMonth()
  document.getElementById('cal-mes').textContent=MES[m]+' '+y
  const prim=new Date(y,m,1)
  const ini=inicioSemana(prim)
  const hj=hojeStr(), selKey=ymd(inicioSemana(_refSem))
  let html='',dias=0,feitasMes=0,totalMes=0
  for(let i=0;i<42;i++){
    const d=addDays(ini,i), key=ymd(d)
    const fora=d.getMonth()!==m
    const sess=_porData[key]||[]
    if(!fora&&sess.length){dias++;totalMes+=sess.length;feitasMes+=sess.filter(function(s){return s.concluida}).length}
    const naSem=ymd(inicioSemana(d))===selKey
    let cls='cal-d'
    if(fora)cls+=' fora'
    else{
      if(sess.length)cls+=' tem'
      if(sess.length&&sess.every(function(s){return s.concluida}))cls+=' tudo'
      if(key===hj)cls+=' hoje'
      else if(naSem)cls+=' sel'
    }
    html+='<div class="'+cls+'"'+(fora?'':' onclick="irData(\''+key+'\')"')+'>'+d.getDate()+'</div>'
    if(i>=34&&addDays(ini,i+1).getMonth()!==m)break
  }
  document.getElementById('cal-grid').innerHTML=html
  const pct=totalMes?Math.round(feitasMes/totalMes*100):0
  document.getElementById('cal-resumo').innerHTML=
    '<div style="display:flex;justify-content:space-between;font-size:12px;color:#63809e;margin-bottom:6px"><span>'+MES[m]+'</span><span style="color:#C9A83C;font-weight:700">'+pct+'%</span></div>'
   +'<div style="background:#0a1420;border-radius:20px;height:6px;overflow:hidden"><div style="height:100%;width:'+pct+'%;background:#C9A83C;border-radius:20px;transition:.5s"></div></div>'
   +'<div style="color:#4d6684;font-size:11px;margin-top:6px">'+feitasMes+' de '+totalMes+' sessoes em '+dias+' dias</div>'
}

function mudarSemana(n){_refSem=addDays(_refSem,n*7);_refMes=new Date(_refSem);renderBoard();renderCal()}
function mudarMes(n){_refMes=new Date(_refMes.getFullYear(),_refMes.getMonth()+n,1);renderCal()}
function irHoje(){const h=new Date();_refSem=h;_refMes=new Date(h);renderBoard();renderCal()}
function irData(k){_refSem=parseD(k);_refMes=parseD(k);renderBoard();renderCal();document.getElementById('board').scrollIntoView({behavior:'smooth',block:'center'})}

async function toggleSessao(id){
  const s=_sessoes.find(function(x){return x.id===id}); if(!s)return
  s.concluida=!s.concluida
  await _supabase.from('sessoes_estudo').update({concluida:s.concluida}).eq('id',id)
  if(s.tipo==='teoria'&&s.topico_id){
    const { data: ex } = await _supabase.from('edital_progresso').select('id')
      .eq('aluno_id',_alunoId).eq('topico_id',s.topico_id).maybeSingle()
    if(ex) await _supabase.from('edital_progresso').update({concluido:s.concluida,atualizado_em:new Date().toISOString()}).eq('id',ex.id)
    else await _supabase.from('edital_progresso').insert({aluno_id:_alunoId,topico_id:s.topico_id,concluido:s.concluida})
  }
  desenhar()
}

async function marcarCaderno(data,val){
  const sess=_porData[data]||[]
  sess.forEach(function(s){s.caderno_erros_lido=val})
  await _supabase.from('sessoes_estudo').update({caderno_erros_lido:val}).eq('aluno_id',_alunoId).eq('data',data)
  renderBoard()
}

function abrirSessao(id){
  const s=_sessoes.find(function(x){return x.id===id}); if(!s)return
  const c=corDe(s.disciplina)
  document.getElementById('modal-c').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px">'
   +'<div><div style="color:'+c+';font-size:12px;font-weight:700">'+esc(s.disciplina)+'</div>'
   +'<div style="font-size:17px;font-weight:700;margin-top:3px;line-height:1.3">'+esc(s.topico)+'</div></div>'
   +'<button class="btn" onclick="fecharModal()" style="padding:5px 11px">✕</button></div>'
   +'<div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">'
   +'<span class="pill pill-t" style="--c:'+c+'">'+LABEL[s.tipo]+'</span>'
   +'<span class="pill">'+dur(s.tempo_minutos)+'</span>'
   +'<span class="pill">'+parseD(s.data).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})+'</span>'
   +(s.meta_questoes?'<span class="pill">meta '+s.meta_questoes+'q</span>':'')+'</div>'
   +'<button class="btn '+(s.concluida?'':'btn-ouro')+'" style="width:100%;padding:12px" onclick="toggleSessao(\''+id+'\');fecharModal()">'
   +(s.concluida?'Desmarcar conclusao':'Marcar como concluida')+'</button>'
   +((s.tipo==='questoes'||s.questoes_feitas)?
      '<div style="margin-top:16px;padding-top:16px;border-top:1px solid #24384f">'
     +'<div style="color:#63809e;font-size:11px;letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-bottom:8px">Registro de questoes</div>'
     +'<div style="display:flex;gap:10px">'
     +'<div style="flex:1"><label style="color:#8fa5bd;font-size:12px">Feitas</label><input class="inp" type="number" id="mqf" min="0" value="'+(s.questoes_feitas||'')+'"></div>'
     +'<div style="flex:1"><label style="color:#8fa5bd;font-size:12px">Acertos</label><input class="inp" type="number" id="mqc" min="0" value="'+(s.questoes_certas||'')+'"></div></div>'
     +'<button class="btn" style="width:100%;margin-top:10px;padding:11px" onclick="salvarQ(\''+id+'\')">Salvar questoes</button>'
     +'<div id="mq-msg" style="font-size:12px;margin-top:8px;text-align:center"></div></div>':'')
  document.getElementById('modal').classList.add('on')
}
function fecharModal(){document.getElementById('modal').classList.remove('on')}

async function salvarQ(id){
  const f=parseInt(document.getElementById('mqf').value)||0
  const c=parseInt(document.getElementById('mqc').value)||0
  const msg=document.getElementById('mq-msg')
  if(c>f){msg.style.color='#f07171';msg.textContent='Acertos nao podem passar do total.';return}
  const r=await _supabase.from('sessoes_estudo').update({questoes_feitas:f,questoes_certas:c}).eq('id',id)
  if(r.error){msg.style.color='#f07171';msg.textContent='Erro ao salvar.';return}
  const s=_sessoes.find(function(x){return x.id===id})
  if(s){s.questoes_feitas=f;s.questoes_certas=c}
  msg.style.color='#6ddba0'
  msg.textContent=f>0?Math.round(c/f*100)+'% de acerto':'Salvo'
  renderBoard()
}

async function sair(){await _supabase.auth.signOut();location.href='index.html'}

document.addEventListener('keydown',function(e){if(e.key==='Escape')fecharModal()})
init()
</script>
