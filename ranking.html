<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking — Patrulheiros de Elite</title>
<script>document.documentElement.setAttribute("data-tema",localStorage.getItem("tema")||"escuro")</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a1420">
<style>
  :root{--ouro:#C9A83C;--ouro-esc:#8a6f1e;--bg:#0a1420;--bg2:#0c1826;--card:#101d2c;--card2:#0d1a28;--btn:#132030;--bd:#1b2c40;--bd2:#24384f;--hov:#16283c;--tx:#e8edf4;--tx2:#8fa5bd;--tx3:#63809e;--tx4:#4d6684;--ok:#6ddba0;--alerta:#e8b04b;--erro:#f07171;--info:#5bb3f0;--roxo:#b98ae0}
  [data-tema="claro"]{--bg:#eef1f6;--bg2:#fff;--card:#fff;--card2:#f7f9fc;--btn:#fff;--bd:#dde4ed;--bd2:#c6d2e0;--hov:#eaf0f8;--tx:#0f1b2a;--tx2:#4a5f78;--tx3:#66809b;--tx4:#8fa2b8}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
  .shell{display:flex;min-height:100vh}
  .side{width:236px;background:var(--bg2);border-right:1px solid var(--bd);padding:20px 14px;display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;z-index:30}
  .logo{display:flex;align-items:center;gap:10px;padding:0 8px 22px}
  .logo-i{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--ouro),var(--ouro-esc));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;overflow:hidden}
  .logo-t{font-size:14px;font-weight:800;line-height:1.2}
  .logo-t span{color:var(--ouro);display:block;font-size:11px;font-weight:600}
  .nav-i{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:11px;color:var(--tx2);font-size:14px;cursor:pointer;margin-bottom:3px;border:1px solid transparent;font-weight:500}
  .nav-i:hover{background:var(--btn);color:var(--tx)}
  .nav-i.on{background:var(--hov);color:var(--ouro);border-color:var(--bd2);font-weight:600}
  .nav-ic{width:19px;text-align:center;font-size:15px;flex-shrink:0}
  .side-sep{height:1px;background:var(--bd);margin:10px 6px}
  .side-b{margin-top:auto;padding-top:14px}
  .main{flex:1;margin-left:236px;padding:22px 24px 60px;min-width:0}
  .h2{font-size:25px;font-weight:800;letter-spacing:-.6px}
  .h2s{color:var(--tx3);font-size:13px;margin-top:2px}
  .btn{padding:9px 15px;border-radius:9px;border:1px solid var(--bd2);background:var(--btn);color:var(--tx2);font-size:13px;cursor:pointer;font-weight:500}
  .btn:hover{border-color:var(--ouro);color:var(--tx)}
  .painel{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}
  .seg{display:inline-flex;background:var(--card2);border:1px solid var(--bd);border-radius:12px;padding:4px;gap:4px}
  .seg button{border:0;background:transparent;color:var(--tx3);font-size:13px;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;font-family:inherit;white-space:nowrap}
  .seg button.on{background:var(--ouro);color:#0a1420;box-shadow:0 2px 10px rgba(201,168,60,.25)}
  .filtros{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
  /* seu lugar */
  .eu-card{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(201,168,60,.16),rgba(201,168,60,.03) 60%),var(--card);border:1px solid rgba(201,168,60,.5);border-radius:18px;padding:20px 22px;margin-bottom:22px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
  .eu-pos{font-size:44px;font-weight:900;line-height:1;color:var(--ouro);letter-spacing:-2px}
  .eu-pos small{font-size:14px;color:var(--tx3);font-weight:700;letter-spacing:0;margin-left:4px}
  .eu-t{font-size:16px;font-weight:800}
  .eu-s{color:var(--tx3);font-size:12.5px;margin-top:3px}
  .eu-meta{margin-top:12px}
  .eu-bar{height:8px;border-radius:10px;background:var(--card2);overflow:hidden}
  .eu-bar div{height:100%;border-radius:10px;background:linear-gradient(90deg,var(--ouro),#f3d77a)}
  .eu-bl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:6px;gap:8px}
  .eu-v{text-align:right}
  .eu-vn{font-size:24px;font-weight:900}
  .eu-vl{font-size:11px;color:var(--tx3)}
  /* podio: 1o, 2o e 3o em ordem */
  .top3{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:12px;margin-bottom:22px}
  .tc{position:relative;border-radius:18px;padding:18px 16px;background:var(--card);border:1px solid var(--bd);display:flex;flex-direction:column;gap:12px;overflow:hidden}
  .tc::before{content:'';position:absolute;inset:0 0 auto 0;height:4px;background:var(--mc)}
  .tc.n1{background:linear-gradient(160deg,rgba(201,168,60,.20),rgba(201,168,60,.03) 70%),var(--card);border-color:rgba(201,168,60,.55)}
  .tc-h{display:flex;align-items:center;gap:12px}
  .tc-av{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;color:#0a1420;flex-shrink:0;position:relative}
  .tc.n1 .tc-av{width:62px;height:62px;font-size:21px;border-radius:18px}
  .tc-md{position:absolute;right:-8px;bottom:-8px;width:26px;height:26px;border-radius:50%;background:var(--bg2);border:2px solid var(--mc);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:var(--mc)}
  .tc-pos{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--mc)}
  .tc-n{font-size:15px;font-weight:800;line-height:1.25;margin-top:2px;word-break:break-word}
  .tc.n1 .tc-n{font-size:17px}
  .tc-v{display:flex;align-items:baseline;gap:6px;margin-top:auto}
  .tc-vn{font-size:24px;font-weight:900;letter-spacing:-.5px}
  .tc.n1 .tc-vn{font-size:30px;color:var(--ouro)}
  .tc-vl{font-size:11.5px;color:var(--tx3)}
  .tc-s{font-size:11.5px;color:var(--tx3)}
  .tc-ver{position:absolute;top:12px;right:12px;font-size:12px;color:var(--ouro);cursor:pointer}
  /* lista */
  .lst{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden}
  .lst-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--bd);font-size:12px;color:var(--tx3);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
  .row{display:grid;grid-template-columns:42px 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--bd)}
  .row:last-child{border-bottom:0}
  .row.eu{background:rgba(201,168,60,.08);box-shadow:inset 3px 0 0 var(--ouro)}
  .pos{font-size:15px;font-weight:800;color:var(--tx3);text-align:center}
  .av{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#0a1420}
  .nm-t{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .nm-b{height:5px;border-radius:5px;background:var(--card2);margin-top:7px;overflow:hidden}
  .nm-b div{height:100%;border-radius:5px;background:var(--bd2)}
  .row.eu .nm-b div{background:var(--ouro)}
  .nm-s{color:var(--tx4);font-size:11px;margin-top:5px}
  .vl{text-align:right;min-width:74px}
  .vl-n{font-size:16px;font-weight:900}
  .vl-l{font-size:10.5px;color:var(--tx3)}
  .row .ver{border:1px solid var(--bd2);background:var(--btn);color:var(--tx2);border-radius:9px;padding:6px 9px;cursor:pointer;font-size:13px;margin-left:8px}
  .side-h{color:var(--tx4);font-size:10px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;padding:14px 12px 6px}
  .vazio{text-align:center;padding:50px 20px;color:var(--tx3)}
  @media(max-width:860px){
    .side{position:static;width:100%;flex-direction:row;overflow-x:auto;padding:10px;border-right:none;border-bottom:1px solid var(--bd);gap:5px;align-items:center}
    .logo,.side-sep,.side-b,.side-h{display:none}
    .nav-i{margin-bottom:0;white-space:nowrap;padding:9px 13px;font-size:13px}
    .shell{flex-direction:column}
    .main{margin-left:0;padding:16px 12px 50px}
    .h2{font-size:22px}
    .top3{grid-template-columns:1fr;gap:10px}
    .tc:not(.n1){flex-direction:row;align-items:center;justify-content:space-between;padding:14px}
    .tc:not(.n1) .tc-av{width:44px;height:44px;font-size:15px;border-radius:13px}
    .tc:not(.n1) > div:last-child{text-align:right;flex-shrink:0}
    .tc:not(.n1) .tc-v{justify-content:flex-end}
    .tc:not(.n1) .tc-vn{font-size:19px}
    .tc:not(.n1) .tc-s{display:none}
    .tc-ver{top:auto;bottom:10px}
    .eu-card{grid-template-columns:auto 1fr;padding:16px}
    .eu-v{grid-column:1 / -1;text-align:left;display:flex;gap:8px;align-items:baseline}
    .row{grid-template-columns:30px 36px minmax(0,1fr) auto;gap:9px;padding:11px 12px}
    .av{width:36px;height:36px;font-size:13px}
    .seg button{padding:8px 12px;font-size:12.5px}
  }
</style>
</head>

<div class="shell">
  <aside class="side" id="side">
    <div class="logo"><div class="logo-i">🛡️</div><div class="logo-t">Patrulheiros<span>de Elite</span></div></div>
    <div class="nav-i" onclick="location.href='cronograma.html'"><span class="nav-ic">📅</span>Meu Cronograma</div>

<script>window.MENU_ADMIN_MANUAL=true</script>
<script src="menu-admin.js"></script>
<script src="config.js"></script>
<script>
const CORES=['#C9A83C','#5bb3f0','#6ddba0','#f07171','#b98ae0','#e8b04b','#4ecdc4','#f0955b','#8ab4f0','#d4e05b']
let _alunoId=null,_tipo='horas',_per='semana',_dados=[],_admin=false

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ymd(d){const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function iniciais(n){const p=String(n||'').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()}
function nomeCurto(n){if(_admin)return String(n||'');const p=String(n||'').trim().split(/\s+/);return p.length>1?p[0]+' '+p[p.length-1][0]+'.':p[0]}
function cor(id){let h=0;for(let i=0;i<String(id).length;i++)h=(h*31+String(id).charCodeAt(i))>>>0;return CORES[h%CORES.length]}
function dur(m){const h=Math.floor(m/60);return h>0?(h+'h'+(m%60?' '+(m%60)+'min':'')):(m+'min')}

function inicioPeriodo(){
  const h=new Date();h.setHours(0,0,0,0)
  if(_per==='dia')return ymd(h)
  if(_per==='semana')return ymd(addDays(h,-((h.getDay()+6)%7)))
  if(_per==='mes')return ymd(new Date(h.getFullYear(),h.getMonth(),1))
  return '2000-01-01'
}

async function ehAdmin(uid){
  try{
    const r=await _supabase.rpc('eh_admin')
    if(!r.error)return !!r.data
  }catch(e){}
  const { data:al }=await _supabase.from('alunos').select('id').eq('id',uid).maybeSingle()
  return !al
}

async function init(){
  const { data:{user} }=await _supabase.auth.getUser()
  if(!user){location.href='index.html';return}
  _alunoId=user.id
  _admin=await ehAdmin(user.id)
  if(_admin)modoAdmin()
  else{
    const { data:eu }=await _supabase.from('alunos').select('*').eq('id',user.id).maybeSingle()
    if(eu&&eu.bloqueado_inatividade){location.href='cronograma.html';return}
  }
  carregarMarca()
  carregar()
}

// mentor: menu do painel admin, nomes completos e atalho para ver o aluno
function modoAdmin(){
  document.getElementById('side').innerHTML=(window.MenuAdmin?MenuAdmin.html('ranking.html'):'<div class="nav-i" onclick="location.href=\'admin.html\'"><span class="nav-ic">←</span>Voltar ao painel</div>')
  document.title='Ranking — Painel do Mentor'
}
function verAluno(id){location.href='cronograma.html?aluno='+id}

async function carregarMarca(){
  const { data:m }=await _supabase.from('config_marca').select('*').eq('id',1).maybeSingle()
  if(!m)return
  if(m.cor_primaria&&String(m.cor_primaria).charAt(0)==='#')document.documentElement.style.setProperty('--ouro',m.cor_primaria)
  const nome=m.nome_marca||'Patrulheiros de Elite',p=nome.split(' ')
  const lt=document.querySelector('.logo-t')
  if(lt)lt.innerHTML=esc(p[0])+'<span>'+esc(p.length>1?p.slice(1).join(' '):(m.slogan||''))+'</span>'
  if(m.logo_url){
    const li=document.querySelector('.logo-i')
    if(li){li.innerHTML='<img src="'+esc(m.logo_url)+'" style="width:100%;height:100%;object-fit:cover">';li.style.background='transparent'}
  }
}

function setTipo(t){_tipo=t;document.querySelectorAll('#ch-tipo button').forEach(function(e){e.classList.toggle('on',e.dataset.t===t)});render()}
function setPer(p){_per=p;document.querySelectorAll('#ch-per button').forEach(function(e){e.classList.toggle('on',e.dataset.p===p)});carregar()}


// busca todas as linhas de uma consulta, de 1000 em 1000 (limite do Supabase)
async function todasLinhas(fabrica){
  const out=[];let ini=0
  for(let g=0;g<200;g++){
    const r=await fabrica().range(ini,ini+999)
    if(r.error)throw r.error
    const d=r.data||[]
    out.push.apply(out,d)
    if(d.length<1000)break
    ini+=1000
  }
  return out
}
function pag(fab,fallback){return todasLinhas(fab).then(function(d){return {data:d}}).catch(function(){return fallback()})}

async function carregar(){
  document.getElementById('loading').style.display='block'
  document.getElementById('conteudo').style.display='none'
  const desde=inicioPeriodo()

  // 1) caminho seguro: o banco soma tudo e devolve so o resultado (nenhum aluno ve dados de outro)
  try{
    const r=await _supabase.rpc('ranking_alunos',{p_desde:desde,p_desde_ts:new Date(desde+'T00:00:00').toISOString()})
    if(!r.error&&Array.isArray(r.data)){
      _dados=r.data.map(function(x){
        const q=Number(x.questoes)||0,ac=Number(x.acertos)||0
        return {id:x.id,nome:x.nome||'',concurso:x.concurso||'',min:Number(x.minutos)||0,q:q,ac:ac,ndias:Number(x.dias)||0,pct:q>0?Math.round(ac/q*100):0}
      })
      document.getElementById('loading').style.display='none'
      document.getElementById('conteudo').style.display='block'
      render()
      return
    }
  }catch(e){}
  // 2) caminho antigo (enquanto o SQL novo nao foi rodado)

  // 3 consultas apenas, independente do numero de alunos
  // de 1000 em 1000: sem isso o ranking ficava incompleto (o Supabase corta em 1000 linhas)
  const [ra,rs,rq,rr]=await Promise.all([
    _supabase.from('alunos').select('id,nome,concursos(nome)'),
    pag(function(){return _supabase.from('sessoes_estudo').select('aluno_id,tempo_minutos,questoes_feitas,questoes_certas,concluida,data').eq('concluida',true).gte('data',desde).order('id')},
        function(){return _supabase.from('sessoes_estudo').select('aluno_id,tempo_minutos,questoes_feitas,questoes_certas,concluida,data').eq('concluida',true).gte('data',desde)}),
    pag(function(){return _supabase.from('questao_respostas').select('aluno_id,correta,respondido_em').gte('respondido_em',new Date(desde+'T00:00:00').toISOString()).order('aluno_id').order('questao_id')},
        function(){return _supabase.from('questao_respostas').select('aluno_id,correta,respondido_em').gte('respondido_em',new Date(desde+'T00:00:00').toISOString())}),
    pag(function(){return _supabase.from('registros_diarios').select('aluno_id,questoes_feitas,questoes_certas,cumpriu,data').gte('data',desde).order('aluno_id').order('data')},
        function(){return _supabase.from('registros_diarios').select('aluno_id,questoes_feitas,questoes_certas,cumpriu,data').gte('data',desde)})
  ])

  const alunos=ra.data||[]
  const acc={}
  alunos.forEach(function(a){ acc[a.id]={id:a.id,nome:a.nome,concurso:a.concursos?a.concursos.nome:'',min:0,q:0,ac:0,dias:{}} })

  ;(rs.data||[]).forEach(function(s){
    const x=acc[s.aluno_id]; if(!x)return
    x.min+=s.tempo_minutos||0
    x.q+=s.questoes_feitas||0
    x.ac+=s.questoes_certas||0
    x.dias[s.data]=1
  })
  ;(rq.data||[]).forEach(function(r){
    const x=acc[r.aluno_id]; if(!x)return
    x.q+=1; if(r.correta)x.ac+=1
  })
  ;(rr.data||[]).forEach(function(r){
    const x=acc[r.aluno_id]; if(!x)return
    x.q+=r.questoes_feitas||0
    x.ac+=r.questoes_certas||0
    if(r.cumpriu)x.dias[r.data]=1
  })

  _dados=Object.keys(acc).map(function(k){
    const x=acc[k]
    x.ndias=Object.keys(x.dias).length
    x.pct=x.q>0?Math.round(x.ac/x.q*100):0
    return x
  })

  document.getElementById('loading').style.display='none'
  document.getElementById('conteudo').style.display='block'
  render()
}

function render(){
  const campo=_tipo==='horas'?'min':'q'
  const lista=_dados.filter(function(x){return x[campo]>0}).sort(function(a,b){
    if(b[campo]!==a[campo])return b[campo]-a[campo]
    return b.ndias-a.ndias
  })
  const per={dia:'hoje',semana:'esta semana',mes:'este mes',geral:'no total'}[_per]
  document.getElementById('sub').textContent=(_tipo==='horas'?'Horas estudadas':'Questoes respondidas')+' — '+per

  if(!lista.length){
    document.getElementById('meu').innerHTML=''
    document.getElementById('podio').innerHTML=''
    document.getElementById('lista').innerHTML=
      '<div class="lst vazio"><div style="font-size:42px;margin-bottom:12px">🏆</div>'
      +'<div style="color:var(--ouro);font-weight:800;font-size:16px">Ranking ainda vazio</div>'
      +'<p style="color:var(--tx3);font-size:13px;margin-top:8px">Ninguem registrou '+(_tipo==='horas'?'estudo':'questoes')+' '+per+'. Seja o primeiro!</p></div>'
    document.getElementById('rodape').textContent=''
    return
  }

  const val=function(x){return _tipo==='horas'?dur(x.min):String(x.q)}
  const lbl=_tipo==='horas'?'estudadas':'questoes'
  const lider=lista[0][campo]||1
  const MED=['#C9A83C','#b9c6d3','#d08a4e']

  // ----- seu lugar -----
  const eu=_admin?null:lista.find(function(x){return x.id===_alunoId})
  const pos=eu?lista.indexOf(eu)+1:null
  const box=document.getElementById('meu')
  if(eu){
    const acima=pos>1?lista[pos-2]:null
    const falta=acima?Math.max(0,acima[campo]-eu[campo]):0
    const pctBar=acima?Math.max(6,Math.min(100,Math.round(eu[campo]/Math.max(1,acima[campo])*100))):100
    box.innerHTML='<div class="eu-card">'
      +'<div class="eu-pos">'+pos+'º<small>de '+lista.length+'</small></div>'
      +'<div><div class="eu-t">'+(pos===1?'Voce lidera o pelotao! 🥇':pos<=3?'Voce esta no podio!':'Sua posicao '+per)+'</div>'
      +'<div class="eu-s">'+eu.ndias+' dia(s) ativo(s)'+(eu.q>0?' · '+eu.pct+'% de acerto':'')+'</div>'
      +(acima?'<div class="eu-meta"><div class="eu-bar"><div style="width:'+pctBar+'%"></div></div>'
        +'<div class="eu-bl"><span>Faltam <strong style="color:var(--ouro)">'+(_tipo==='horas'?dur(falta):falta)+'</strong> para passar o '+(pos-1)+'º lugar</span><span>'+pctBar+'%</span></div></div>'
        :'<div class="eu-s" style="margin-top:8px;color:var(--ouro);font-weight:700">Mantenha o ritmo para seguir na frente.</div>')
      +'</div>'
      +'<div class="eu-v"><div class="eu-vn">'+val(eu)+'</div><div class="eu-vl">'+lbl+'</div></div>'
      +'</div>'
  }else if(_admin){
    const sem=_dados.filter(function(x){return !(x[campo]>0)})
    box.innerHTML='<div class="painel" style="margin-bottom:18px;font-size:13px;color:var(--tx2);line-height:1.6">'
      +'<strong style="color:var(--ouro)">Visao do mentor</strong> — os alunos veem so o primeiro nome e a inicial do sobrenome. Toque em 👁️ para abrir a area do aluno.'
      +(sem.length?'<div style="margin-top:8px;color:var(--erro)"><strong>'+sem.length+' aluno(s) sem registro '+per+':</strong> <span style="color:var(--tx3)">'+sem.map(function(x){return esc(x.nome)}).join(', ')+'</span></div>':'')
      +'</div>'
  }else{
    box.innerHTML='<div class="painel" style="margin-bottom:18px;text-align:center;color:var(--tx3);font-size:13px">Voce ainda nao pontuou '+per+'. Registre seu estudo para entrar no ranking!</div>'
  }

  // ----- top 3, em ordem: 1o, 2o, 3o -----
  const top=lista.slice(0,3)
  document.getElementById('podio').innerHTML=top.length?'<div class="top3">'+top.map(function(x,i){
    return '<div class="tc n'+(i+1)+'" style="--mc:'+MED[i]+'">'
      +(_admin?'<span class="tc-ver" onclick="verAluno(\''+x.id+'\')">👁️ ver</span>':'')
      +'<div class="tc-h"><div class="tc-av" style="background:'+cor(x.id)+'">'+iniciais(x.nome)+'<span class="tc-md">'+(i+1)+'</span></div>'
      +'<div style="min-width:0"><div class="tc-pos">'+['🥇 1º lugar','🥈 2º lugar','🥉 3º lugar'][i]+'</div>'
      +'<div class="tc-n">'+esc(nomeCurto(x.nome))+(x.id===_alunoId?' <span style="color:var(--ouro);font-size:11px">(voce)</span>':'')+'</div></div></div>'
      +'<div><div class="tc-v"><span class="tc-vn">'+val(x)+'</span><span class="tc-vl">'+lbl+'</span></div>'
      +'<div class="tc-s">'+x.ndias+' dia(s) ativo(s)'+(x.q>0?' · '+x.pct+'% acerto':'')+'</div></div>'
      +'</div>'
  }).join('')+'</div>':''

  // ----- demais posicoes -----
  const resto=lista.slice(3)
  document.getElementById('lista').innerHTML=resto.length?'<div class="lst"><div class="lst-h"><span>Classificacao</span><span>'+lbl+'</span></div>'
    +resto.map(function(x,i){
      const p=i+4, w=Math.max(3,Math.round(x[campo]/lider*100))
      return '<div class="row'+(x.id===_alunoId?' eu':'')+'">'
        +'<div class="pos">'+p+'º</div>'
        +'<div class="av" style="background:'+cor(x.id)+'">'+iniciais(x.nome)+'</div>'
        +'<div style="min-width:0"><div class="nm-t">'+esc(nomeCurto(x.nome))+(x.id===_alunoId?' <span style="color:var(--ouro);font-size:11px">(voce)</span>':'')+'</div>'
        +'<div class="nm-b"><div style="width:'+w+'%"></div></div>'
        +'<div class="nm-s">'+x.ndias+' dia(s) ativo(s)'+(x.q>0?' · '+x.pct+'% acerto':'')+'</div></div>'
        +'<div style="display:flex;align-items:center"><div class="vl"><div class="vl-n">'+val(x)+'</div><div class="vl-l">'+lbl+'</div></div>'
        +(_admin?'<button class="ver" title="Ver como aluno" onclick="verAluno(\''+x.id+'\')">👁️</button>':'')+'</div>'
        +'</div>'
    }).join('')+'</div>':''

  const totMin=lista.reduce(function(s,x){return s+x.min},0)
  const totQ=lista.reduce(function(s,x){return s+x.q},0)
  document.getElementById('rodape').textContent=lista.length+' aluno(s) no ranking · a turma somou '+dur(totMin)+' e '+totQ+' questoes '+per
}

async function sair(){await _supabase.auth.signOut();location.href=_admin?'admin.html':'index.html'}
init()
</script>
</body>
</html>
