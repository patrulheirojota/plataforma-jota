<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patrulheiros de Elite — Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0a1420">
  <link rel="apple-touch-icon" href="/icone-192.png">
  <script>document.documentElement.setAttribute("data-tema",localStorage.getItem("tema")||"escuro")</script>
</head>
<body>
  <div class="login-box">
    <h1>Patrulheiros de Elite</h1>
    <p>Acesse sua plataforma de estudos</p>
    <input type="email" id="email" placeholder="Seu e-mail">
    <input type="password" id="senha" placeholder="Sua senha">
    <button onclick="login()">Entrar</button>
    <p id="msg-erro" style="color:#e57373;display:none;margin-top:10px"></p>
    <p style="margin-top:16px">
      <a href="#" onclick="esqueceuSenha()" style="color:#C9A83C;font-size:14px">Esqueci minha senha</a>
    </p>
    <div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)">
      <div style="color:#8fa5bd;font-size:13px;margin-bottom:8px">Acabou de comprar a mentoria?</div>
      <a href="primeiro-acesso.html" style="display:inline-block;padding:10px 16px;border-radius:10px;border:1px solid #C9A83C;color:#C9A83C;font-weight:700;font-size:14px;text-decoration:none">Primeiro acesso: criar meu login</a>
    </div>
  </div>
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="comum.js"></script>
</body>
</html>
